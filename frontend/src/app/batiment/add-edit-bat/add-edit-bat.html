<div class="modal-header bg-light-primary py-1">
    <h5 class="modal-title font-weight-bold">
        <i class="bx" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modification bâtiment' : 'Nouveau bâtiment' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-4"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="pt-2">
        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label font-weight-bold">Nom du Bâtiment <span class="text-danger">*</span></label>
                <div class="position-relative has-icon-left">
                    <input type="text" class="form-control" formControlName="nom" placeholder="ex: Siège Social">
                    <div class="form-control-position"><i class="bx bx-building"></i></div>
                </div>
                <small class="text-danger" *ngIf="form.get('nom')?.touched && form.get('nom')?.hasError('required')">
                    Le nom est obligatoire
                </small>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label font-weight-bold">Code / Réf <span class="text-danger">*</span></label>
                <div class="position-relative has-icon-left">
                    <input type="text" class="form-control" formControlName="code" placeholder="ex: BAT-01">
                    <div class="form-control-position"><i class="bx bx-hash"></i></div>
                </div>
                <small class="text-danger" *ngIf="form.get('code')?.touched && form.get('code')?.hasError('required')">
                    Le code est obligatoire
                </small>
            </div>

            <div class="col-12 mb-1">
                <label class="form-label font-weight-bold">Adresse Complète <span class="text-danger">*</span></label>
                <div class="position-relative has-icon-left">
                    <input type="text" class="form-control" formControlName="adresse" placeholder="ex: 12 Rue des Archives">
                    <div class="form-control-position"><i class="bx bx-map"></i></div>
                </div>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label font-weight-bold">Ville</label>
                <input type="text" class="form-control" formControlName="ville" placeholder="ex: Alger">
            </div>

            <div class="col-12 mb-1">
                <label class="form-label font-weight-bold">Description additionnelle</label>
                <textarea class="form-control" formControlName="description" rows="3" placeholder="Informations complémentaires..."></textarea>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions class="px-2 pb-2 justify-content-end">
        <button class="btn btn-light-secondary mr-1" type="button" mat-dialog-close>
            <i class="bx bx-x mr-25"></i> Annuler
        </button>
        <button class="btn btn-primary glow shadow" type="submit" [disabled]="form.invalid">
            <i class="bx bx-check-circle mr-25"></i> {{ isEditMode ? 'Enregistrer les modifications' : 'Créer le bâtiment' }}
        </button>
    </mat-dialog-actions>
</form>
