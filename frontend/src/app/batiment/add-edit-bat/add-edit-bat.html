<div class="modal-header">
    <h5 class="modal-title">
        <i class="bx text-primary" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modifier Bâtiment' : 'Nouveau Bâtiment' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-3"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="px-3 pb-2 pt-1">
        <div class="section-title">Informations de base</div>
        <div class="row">
            <div class="col-md-8 mb-1">
                <label class="form-label">Désignation Officielle <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-building"></i>
                    <input type="text" class="form-control" formControlName="nom" placeholder="Nom du bâtiment">
                </div>
            </div>

            <div class="col-md-4 mb-1">
                <label class="form-label">Code / Réf <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-hash"></i>
                    <input type="text" class="form-control" formControlName="code" placeholder="BAT-XX">
                </div>
            </div>
        </div>

        <div class="section-title">Coordonnées</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Adresse Complète <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-map"></i>
                    <input type="text" class="form-control" formControlName="adresse" placeholder="Adresse physique">
                </div>
            </div>

            <div class="col-md-7 mb-1">
                <label class="form-label">Ville</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-map-pin"></i>
                    <input type="text" class="form-control" formControlName="ville" placeholder="Ville">
                </div>
            </div>
        </div>

        <div class="section-title">Compléments</div>
        <div class="row">
            <div class="col-12 mb-1">
                <label class="form-label">Notes</label>
                <textarea class="form-control" formControlName="description" rows="2" placeholder="Observations..."></textarea>
            </div>
        </div>
    </mat-dialog-content>

    <div class="dialog-actions">
        <button class="btn btn-light-secondary" type="button" mat-dialog-close>Annuler</button>
        <button class="btn btn-primary glow shadow-sm" type="submit">
            {{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
    </div>
</form>
