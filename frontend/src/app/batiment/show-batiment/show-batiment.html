<!-- batiment/show-batiment/show-batiment.html -->
<div class="content-header row">
    <div class="content-header-left col-12 mb-2 mt-1">
        <div class="row breadcrumbs-top">
            <div class="col-12">
                <h5 class="content-header-title float-left pr-1 mb-0">Gestion des Bâtiments</h5>
                <div class="breadcrumb-wrapper col-12">
                    <ol class="breadcrumb p-0 mb-0">
                        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="bx bx-home-alt"></i></a></li>
                        <li class="breadcrumb-item active">Lieu</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="users-list-wrapper">
    <!-- Barre de filtrage élégante -->
    <div class="users-list-filter px-1">
        <div class="row border rounded py-2 mb-2 bg-white shadow-sm mx-0">
            <div class="col-12 col-sm-6 col-lg-4 d-flex align-items-center">
                <div [formGroup]="filterForm" class="w-100">
                    <fieldset class="form-group position-relative has-icon-left mb-0">
                        <input type="text" class="form-control" formControlName="search" placeholder="Rechercher (Nom, Ville, Adresse)...">
                        <div class="form-control-position">
                            <i class="bx bx-search"></i>
                        </div>
                    </fieldset>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-8 d-flex align-items-center justify-content-end mt-sm-0 mt-1">
                <button class="btn btn-primary glow shadow px-2" (click)="openAddDialog()">
                    <i class="bx bx-plus-circle mr-50"></i> Ajouter un Bâtiment
                </button>
            </div>
        </div>
    </div>

    <!-- Tableau Moderne -->
    <div class="users-list-table">
        <div class="card shadow-sm border-0">
            <div class="card-content">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="thead-light">
                                <tr>
                                    <th class="py-2">Nom</th>
                                    <th class="py-2">Localisation</th>
                                    <th class="py-2">Nombre des Salles</th>
                                    <th class="py-2 text-right px-2">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let b of dataSource.filteredData">
                                    <td class="py-2">
                                        <div class="d-flex align-items-center">
                                            <div class="avatar bg-light-primary mr-1">
                                                <div class="avatar-content">
                                                    <i class="bx bx-building-house text-primary"></i>
                                                </div>
                                            </div>
                                            <div>
                                                <h6 class="mb-0 font-weight-bold">{{b.nom}}</h6>
                                                <small class="text-muted">{{b.code || 'B-'+b.id}}</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="py-2">
                                        <span class="text-primary font-weight-600"><i class="bx bx-map-pin mr-25"></i> {{b.ville}}</span><br>
                                        <small class="text-muted">{{b.adresse}}</small>
                                    </td>
                                    <td class="py-2">
                                        <div class="badge badge-pill badge-light-success px-1">
                                            <i class="bx bx-layout mr-25"></i> {{b.nombre_salles || 0}} Salles
                                        </div>
                                    </td>
                                    <td class="py-2 text-right px-2">
                                        <div class="dropdown d-inline-block">
                                            <button class="btn btn-sm btn-icon btn-light-primary mr-1" (click)="openEditDialog(b)" title="Modifier">
                                                <i class="bx bx-edit-alt"></i>
                                            </button>
                                            <button class="btn btn-sm btn-icon btn-light-danger" (click)="deleteBatiment(b)" title="Supprimer">
                                                <i class="bx bx-trash-alt"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr *ngIf="dataSource.filteredData.length === 0">
                                    <td colspan="4" class="text-center py-5">
                                        <div class="empty-state">
                                            <i class="bx bx-info-circle font-large-2 text-muted mb-1"></i>
                                            <p class="text-muted">Aucun bâtiment correspondant.</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-2 d-flex justify-content-between align-items-center border-top">
                        <small class="text-muted">Total: {{dataSource.filteredData.length}}</small>
                        <mat-paginator [pageSizeOptions]="[5, 10, 15]" class="custom-paginator"></mat-paginator>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
