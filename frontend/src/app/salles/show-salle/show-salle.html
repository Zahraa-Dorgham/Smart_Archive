<div class="content-header row">
    <div class="content-header-left col-12 mb-2 mt-1">
        <div class="row breadcrumbs-top">
            <div class="col-12">
                <h5 class="content-header-title float-left pr-1 mb-0">Gestion des Salles</h5>
                <div class="breadcrumb-wrapper col-12">
                    <ol class="breadcrumb p-0 mb-0">
                        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="bx bx-home-alt"></i></a></li>
                        <li class="breadcrumb-item active">Salles d'archivage</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="users-list-wrapper">
    <div class="users-list-filter px-1">
        <form [formGroup]="filterForm" class="row border rounded py-2 mb-2 bg-white shadow-sm mx-0">
            <div class="col-12 col-sm-6 col-lg-3">
                <label class="font-weight-bold">Recherche</label>
                <fieldset class="form-group position-relative has-icon-left mb-0">
                    <input type="text" class="form-control" formControlName="search" placeholder="Nom ou code...">
                    <div class="form-control-position"><i class="bx bx-search"></i></div>
                </fieldset>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <label class="font-weight-bold">Bâtiment</label>
                <fieldset class="form-group mb-0">
                    <select class="form-control" formControlName="batiment">
                        <option value="">Tous les bâtiments</option>
                        <option *ngFor="let b of batiments" [value]="b.id">{{ b.nom }}</option>
                    </select>
                </fieldset>
            </div>
            <div class="col-12 col-sm-6 col-lg-6 d-flex align-items-center justify-content-end mt-sm-0 mt-1">
                <button type="button" class="btn btn-primary glow shadow px-2" (click)="openAddDialog()">
                    <i class="bx bx-plus-circle mr-50"></i> Nouvelle Salle
                </button>
            </div>
        </form>
    </div>

    <div class="users-list-table">
        <div class="card shadow-sm border-0">
            <div class="card-content">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="thead-light">
                                <tr>
                                    <th class="py-2">Code</th>
                                    <th class="py-2">Désignation</th>
                                    <th class="py-2">Localisation (Bâtiment)</th>
                                    <th class="py-2">Niveau (Étage)</th>
                                    <th class="py-2 text-right px-2">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let s of dataSource.filteredData">
                                    <td class="py-2">
                                        <span class="badge badge-light-primary text-uppercase font-weight-bold">{{s.code}}</span>
                                    </td>
                                    <td class="py-2">
                                        <h6 class="mb-0 font-weight-bold">{{s.nom}}</h6>
                                        <!-- <small class="text-muted">{{s.type_salle || 'Standard'}}</small> -->
                                    </td>
                                    <td class="py-2">
                                        <div class="d-flex align-items-center text-primary">
                                            <i class="bx bx-buildings mr-50"></i> {{s.batiment_nom || s.batiment}}
                                        </div>
                                    </td>
                                    <td class="py-2">
                                        <span class="badge badge-pill badge-light-secondary px-1">Étage {{s.etage}}</span>
                                    </td>
                                    <td class="py-2 text-right px-2">
                                        <button class="btn btn-sm btn-icon btn-light-primary mr-1" (click)="openEditDialog(s)" title="Modifier">
                                            <i class="bx bx-edit-alt"></i>
                                        </button>
                                        <button class="btn btn-sm btn-icon btn-light-danger" (click)="deleteSalle(s)" title="Supprimer">
                                            <i class="bx bx-trash-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr *ngIf="dataSource.filteredData.length === 0">
                                    <td colspan="5" class="text-center py-4 text-muted">Aucune salle disponible.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-2 d-flex justify-content-between align-items-center border-top">
                        <small class="text-muted">Total: {{dataSource.filteredData.length}}</small>
                        <mat-paginator [pageSizeOptions]="[5,10,15]" class="custom-paginator"></mat-paginator>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
