<div class="modal-header">
    <h5 class="modal-title">
        <i class="bx text-primary" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modifier la Salle' : 'Nouvelle Salle' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-3"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="px-3 pb-2 pt-1">
        <div class="section-title">Identité & Code</div>
        <div class="row">
            <div class="col-md-8 mb-1">
                <label class="form-label">Désignation de la Salle <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-layout"></i>
                    <input type="text" class="form-control" formControlName="nom" placeholder="Nom de la salle">
                </div>
            </div>

            <div class="col-md-4 mb-1">
                <label class="form-label">Code <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-hash"></i>
                    <input type="text" class="form-control" formControlName="code" placeholder="SL-XX">
                </div>
            </div>
        </div>

        <div class="section-title">Affectation</div>
        <div class="row">
            <div class="col-md-7 mb-1">
                <label class="form-label">Bâtiment <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-buildings"></i>
                    <select class="form-control" formControlName="batiment">
                        <option [value]="null" disabled selected>Choisir un bâtiment...</option>
                        <option *ngFor="let b of data.batiments" [value]="b.id">{{ b.nom }}</option>
                    </select>
                </div>
            </div>

            <div class="col-md-5 mb-1">
                <label class="form-label">Niveau (Étage)</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-layer"></i>
                    <input type="number" class="form-control" formControlName="etage" placeholder="0">
                </div>
            </div>
        </div>

        <div class="section-title">Compléments</div>
        <div class="row">
            <div class="col-12 mb-1">
                <label class="form-label">Observations</label>
                <textarea class="form-control" formControlName="description" rows="2" placeholder="Notes techniques..."></textarea>
            </div>
        </div>
    </mat-dialog-content>

    <div class="dialog-actions">
        <button class="btn btn-light-secondary" type="button" mat-dialog-close>Annuler</button>
        <button class="btn btn-primary glow shadow-sm" type="submit">
            {{ isEditMode ? 'Enregistrer' : 'Créer' }}
        </button>
    </div>
</form>
