<div class="modal-header">
    <h5 class="modal-title">
        <i class="bx text-primary" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modifier le Boîtier' : 'Nouveau Boîtier' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-3"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="px-3 pb-2 pt-1">
        <!-- Section Identité -->
        <div class="section-title">Identité & Traçabilité</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Code Boîtier <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-box"></i>
                    <input type="text" class="form-control" formControlName="idboit" placeholder="BOX-2024-001">
                </div>
            </div>
            <!-- <div class="col-md-6 mb-1">
                <label class="form-label">Code-barres <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-barcode-reader"></i>
                    <input type="text" class="form-control" formControlName="code_barre" placeholder="Scanner tag...">
                </div>
            </div> -->
        </div>

        <div class="row">
            <div class="col-12 mb-1">
                <label class="form-label">Titre <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-purchase-tag-alt"></i>
                    <input type="text" class="form-control" formControlName="titre" placeholder="Nom descriptif du conteneur">
                </div>
            </div>
        </div>

        <!-- Section Localisation -->
        <div class="section-title">Localisation & Capacité</div>
        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Armoire Parente</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-archive"></i>
                    <select class="form-control" formControlName="armoire">
                        <!-- <option value="">Aucune</option> -->
                        <option *ngFor="let a of armoires" [value]="a.id">{{ a.code }}</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-1">
                <label class="form-label">Étagère / Niveau</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-list-ol"></i>
                    <select class="form-control" formControlName="etagere">
                        <!-- <option value="">Aucune</option> -->
                        <option *ngFor="let e of etageres" [value]="e.id">Niveau {{ e.numero }}</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Capacité (Dossiers) <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-archive"></i>
                    <input type="number" class="form-control" formControlName="capacite" placeholder="10">
                </div>
            </div>
            <!-- <div class="col-md-6 mb-1">
                <label class="form-label">Statut Actuel <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-check-shield"></i>
                    <select class="form-control" formControlName="statut">
                        <option value="ACTIF">Actif / Ouvert</option>
                        <option value="PLEIN">Plein / Scellé</option>
                        <option value="ARCHIVE">Archivé</option>
                        <option value="EN_TRANSFERT">En transfert</option>
                        <option value="EN_PREPARATION">En préparation</option>
                    </select>
                </div>
            </div> -->
        </div>

        <!-- Section Notes -->
        <!-- <div class="section-title">Notes Techniques</div>
        <div class="row">
            <div class="col-12 mb-1">
                <textarea class="form-control" formControlName="description" rows="2" placeholder="Informations complémentaires..."></textarea>
            </div>
        </div> -->
    </mat-dialog-content>

    <div class="dialog-actions">
        <button class="btn btn-light-secondary" type="button" mat-dialog-close>Annuler</button>
        <button class="btn btn-primary glow shadow-sm" type="submit" [disabled]="form.invalid">
            {{ isEditMode ? 'Enregistrer les modifications' : 'Créer le Boîtier' }}
        </button>
    </div>
</form>
