<div class="content-header row">
    <div class="content-header-left col-12 mb-2 mt-1">
        <div class="row breadcrumbs-top">
            <div class="col-12">
                <h5 class="content-header-title float-left pr-1 mb-0">
                    <button *ngIf="filterForm.get('etagere')?.value" class="btn btn-sm btn-icon btn-light-secondary mr-50" [routerLink]="['/etageres']" [queryParams]="{ armoire: grandParentArmoireId }" title="Retour aux étagères">
                        <i class="bx bx-arrow-back"></i>
                    </button>
                    Gestion des Conteneurs
                </h5>
                <div class="breadcrumb-wrapper col-12">
                    <ol class="breadcrumb p-0 mb-0">
                        <li class="breadcrumb-item"><a routerLink="/dashboard"><i class="bx bx-home-alt"></i></a></li>
                        <li class="breadcrumb-item active">Boîtiers d'archivage</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="users-list-wrapper">
    <div class="users-list-filter px-1">
        <form [formGroup]="filterForm" class="row border rounded py-2 mb-2 bg-white shadow-sm mx-0">
            <div class="col-12 col-sm-6 col-lg-3">
                <label class="font-weight-bold">Recherche Rapide</label>
                <fieldset class="form-group position-relative has-icon-left mb-0">
                    <input type="text" class="form-control" formControlName="search" placeholder="ID, Titre ou Code-barres...">
                    <div class="form-control-position"><i class="bx bx-search"></i></div>
                </fieldset>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <label class="font-weight-bold">Étagère</label>
                <fieldset class="form-group mb-0">
                    <select class="form-control" formControlName="etagere">
                        <option value="">Toutes les étagères</option>
                        <option *ngFor="let et of etageres" [value]="et.id">{{ getEtagereLabel(et) }}</option>
                    </select>
                </fieldset>
            </div>
            <div class="col-12 col-sm-6 col-lg-6 d-flex align-items-center justify-content-end mt-sm-0 mt-1">
                <button type="button" class="btn btn-primary glow shadow px-2" (click)="openAddDialog()">
                    <i class="bx bx-plus-circle mr-50"></i> Nouveau Boîtier
                </button>
            </div>
        </form>
    </div>

    <div class="users-list-table">
        <div class="card shadow-sm border-0">
            <div class="card-content">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="thead-light">
                                <tr>
                                    <th class="py-2">Identifiant</th>
                                    <th class="py-2">Titre</th>
                                    <th class="py-2">Localisation</th>
                                    <th class="py-2">Capacité</th>
                                    <th class="py-2 text-right px-2">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let b of dataSource.connect() | async">
                                    <td class="py-2">
                                        <div class="d-flex align-items-center">
                                            <div class="avatar bg-light-warning mr-1">
                                                <div class="avatar-content"><i class="bx bx-box"></i></div>
                                            </div>
                                            <span class="font-weight-bold text-primary">{{b.idboit}}</span>
                                        </div>
                                    </td>
                                    <td class="py-2">
                                        {{b.titre}}
                                        <div class="small text-muted">{{b.code_barre}}</div>
                                    </td>
                                    <td class="py-2">
                                        <i class="bx bx-map-pin mr-25"></i> {{getLocalisation(b)}}
                                    </td>
                                    <td class="py-2">
                                        <i class="bx bx-archive mr-25"></i> {{b.capacite}}
                                    </td>
                                    <td class="py-2 text-right px-2">
                                        <button class="btn btn-sm btn-icon btn-light-success mr-1" [routerLink]="['/archiviste/dossiers']" [queryParams]="{boitier: b.id}" title="Voir les Dossiers">
                                            <i class="bx bx-folder"></i>
                                        </button>
                                        <button class="btn btn-sm btn-icon btn-light-primary mr-1" (click)="openEditDialog(b)" title="Modifier">
                                            <i class="bx bx-edit-alt"></i>
                                        </button>
                                        <button class="btn btn-sm btn-icon btn-light-danger" (click)="deleteBoitier(b)" title="Supprimer">
                                            <i class="bx bx-trash-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                                <tr *ngIf="dataSource.filteredData.length === 0">
                                    <td colspan="4" class="text-center py-4 text-muted">Aucun boîtier trouvé.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-2 d-flex justify-content-between align-items-center border-top">
                        <small class="text-muted">Total: {{dataSource.filteredData.length}}</small>
                        <mat-paginator [pageSizeOptions]="[5, 10, 15]" class="custom-paginator"></mat-paginator>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
