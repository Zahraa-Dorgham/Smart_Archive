<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h3 class="mb-0">Modifier l'utilisateur</h3>
        </div>
        <div class="card-body">
            <div *ngIf="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
                <p class="mt-3 text-muted">Chargement des donnees...</p>
            </div>
            <form (ngSubmit)="onSubmit()" *ngIf="!loading">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Prenom *</label>
                        <input type="text" class="form-control" [(ngModel)]="userData.first_name" name="first_name"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom *</label>
                        <input type="text" class="form-control" [(ngModel)]="userData.last_name" name="last_name"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" [(ngModel)]="userData.email" name="email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nouveau mot de passe</label>
                        <input type="password" class="form-control" [(ngModel)]="userData.password" name="password">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Statut</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" [(ngModel)]="userData.is_active"
                                name="is_active">
                            <label class="form-check-label">{{ userData.is_active ? 'Actif' : 'Inactif' }}</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role(s)</label>
                        <select multiple class="form-select" [(ngModel)]="selectedGroupIds" name="groups">
                            <option *ngFor="let group of allGroups" [ngValue]="group.id">{{ group.name }}</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Permissions directes</label>
                        <select multiple class="form-select" [(ngModel)]="selectedPermissionIds" name="user_permissions">
                            <option *ngFor="let permission of allPermissions" [ngValue]="permission.id">
                                {{ permission.app_label }} / {{ permission.model }} / {{ permission.codename }}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4 gap-2">
                    <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
                    <button type="submit" class="btn btn-primary" [disabled]="submitting">
                        {{ submitting ? 'Enregistrement...' : 'Enregistrer les modifications' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
