<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h3 class="mb-0">Modifier l'utilisateur</h3>
        </div>
        <div class="card-body">
            <form (ngSubmit)="onSubmit()">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Prénom *</label>
                        <input type="text" class="form-control" [(ngModel)]="userData.first_name" name="first_name"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom *</label>
                        <input type="text" class="form-control" [(ngModel)]="userData.last_name" name="last_name"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" [(ngModel)]="userData.email" name="email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Téléphone</label>
                        <input type="text" class="form-control" [(ngModel)]="userData.phone" name="phone">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Adresse</label>
                        <textarea class="form-control" rows="2" [(ngModel)]="userData.address"
                            name="address"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Statut</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" [(ngModel)]="userData.is_active"
                                name="is_active">
                            <label class="form-check-label">{{ userData.is_active ? 'Actif' : 'Inactif' }}</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rôle(s)</label>
                        <select multiple class="form-select" [(ngModel)]="selectedGroupIds" name="groups">
                            <option *ngFor="let group of allGroups" [value]="group.id">{{ group.name }}</option>
                        </select>
                        <small class="text-muted">Ctrl+clic pour sélection multiple</small>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4 gap-2">
                    <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
                    <button type="submit" class="btn btn-primary" [disabled]="submitting">
                        {{ submitting ? 'Enregistrement...' : 'Enregistrer les modifications' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
