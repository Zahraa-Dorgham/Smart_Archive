<div class="container py-5">
    <div class="card shadow-sm border-0">
        <div class="card-header pt-4">
            <div class="d-flex align-items-center">
                <div class="avatar bg-light-primary mr-1" style="width: 45px; height: 45px; border-radius: 8px;">
                    <i class="bx bx-user-plus font-medium-4"></i>
                </div>
                <div>
                    <h3 class="mb-0 fw-bold" style="color: #475f7b;">Nouvel Utilisateur</h3>
                    <p class="text-muted small mb-0">Créez un nouveau compte utilisateur et définissez ses accès.</p>
                </div>
            </div>
        </div>

        <div class="card-body px-4 pt-4">
            <div class="stepper d-flex justify-content-between mb-5 shadow-none border">
                <div class="step" [class.active]="currentStep === 1" (click)="goToStep(1)">
                    <i class="step-icon bx bx-info-circle"></i>
                    <div class="step-label">Informations</div>
                </div>
                <div class="step" [class.active]="currentStep === 2" (click)="goToStep(2)">
                    <i class="step-icon bx bx-shield-quarter"></i>
                    <div class="step-label">Rôles</div>
                </div>
            </div>

            <form (ngSubmit)="onSubmit()">
                <!-- STEP 1: BASIC INFO -->
                <div *ngIf="currentStep === 1" class="animate__animated animate__fadeIn">
                    <div class="section-title">Informations Personnelles</div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Prénom <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" [(ngModel)]="userData.first_name" name="first_name"
                                placeholder="" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" [(ngModel)]="userData.last_name" name="last_name"
                                placeholder="" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email / Identifiant <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bx bx-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0" [(ngModel)]="userData.email"
                                    name="email" autocomplete="new-password" placeholder="email@exemple.com" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Direction / Département</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bx bx-buildings text-muted"></i></span>
                                <select class="form-select border-start-0" [(ngModel)]="userData.direction"
                                    name="direction">
                                    <option [ngValue]="null">-- Non spécifiée --</option>
                                    <option *ngFor="let dir of directions" [ngValue]="dir.id">
                                        {{ dir.nom }} ({{ dir.code }})
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Numéro de téléphone</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bx bx-phone text-muted"></i></span>
                                <input type="text" class="form-control border-start-0" [(ngModel)]="userData.telephone"
                                    name="telephone" placeholder="+216 ...">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Adresse</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bx bx-map text-muted"></i></span>
                                <input type="text" class="form-control border-start-0" [(ngModel)]="userData.adresse"
                                    name="adresse" placeholder="Adresse complète...">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bx bx-lock-alt text-muted"></i></span>
                                <input [type]="showPassword ? 'text' : 'password'"
                                    class="form-control border-start-0 border-end-0" [(ngModel)]="userData.password"
                                    name="password" autocomplete="new-password" placeholder="••••••••" required>
                                <button type="button" class="input-group-text bg-white border-start-0"
                                    (click)="togglePassword()">
                                    <i class="bx" [class.bx-show]="!showPassword" [class.bx-hide]="showPassword"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Statut du compte</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" [(ngModel)]="userData.is_active"
                                    name="is_active" id="statusSwitch">
                                <label class="form-check-label fw-bold" for="statusSwitch"
                                    [class.text-success]="userData.is_active" [class.text-danger]="!userData.is_active">
                                    {{ userData.is_active ? 'Actif' : 'Inactif' }}
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-5 border-top pt-3">
                        <button type="button" class="btn btn-primary glow px-4 shadow-sm" (click)="nextStep()">
                            Continuer <i class="bx bx-chevron-right ml-25"></i>
                        </button>
                    </div>
                </div>

                <!-- STEP 2: ROLE ASSIGNMENT -->
                <div *ngIf="currentStep === 2" class="animate__animated animate__fadeIn">
                    <div class="section-title">Attribution de Rôle</div>

                    <div class="row">
                        <div class="col-md-8">
                            <label class="form-label">Sélectionner le rôle principal <span
                                    class="text-danger">*</span></label>
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bx" [class.bx-shield-alt-2]="!userData.role_id"
                                        [class.bx-check-shield]="userData.role_id" text-muted></i>
                                </span>
                                <select class="form-select border-start-0" [(ngModel)]="userData.role_id"
                                    name="role_id">
                                    <option [ngValue]="null">-- Choisir un rôle --</option>
                                    <option *ngFor="let role of roles" [ngValue]="role.id">
                                        {{ role.nom || role.name }}
                                    </option>
                                </select>
                            </div>
                            <small class="text-muted d-block mt-1">Le rôle détermine les permissions de l'utilisateur
                                dans le système.</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-5 border-top pt-3">
                        <button type="button" class="btn btn-light-secondary px-4" (click)="prevStep()">
                            <i class="bx bx-chevron-left mr-25"></i> Précédent
                        </button>
                        <div>
                            <button type="button" class="btn btn-link text-muted me-2"
                                (click)="cancel()">Annuler</button>
                            <button type="submit" class="btn btn-primary glow px-5 shadow-sm" [disabled]="submitting">
                                <i class="bx bx-save mr-50"></i> {{ submitting ? 'Création...' : 'Créer l\'utilisateur'
                                }}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
