<div class="modal-header">
    <h5 class="modal-title">
        <i class="bx text-primary" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modifier le calendrier' : 'Nouveau calendrier' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-3"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="px-3 pb-2 pt-1">
        <div class="section-title">Identification</div>
        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Code <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-hash"></i>
                    <input type="text" class="form-control" formControlName="code" placeholder="ex: CAL-001">
                </div>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label">Intitulé <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-heading"></i>
                    <input type="text" class="form-control" formControlName="title" placeholder="Titre du calendrier">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Description</label>
                <textarea class="form-control" formControlName="description" rows="2" placeholder="Description..."></textarea>
            </div>
        </div>

        <div class="section-title">Classification</div>
        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Type d'exemplaire</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-shape-circle"></i>
                    <input type="text" class="form-control" formControlName="exemplaire_type" placeholder="Type">
                </div>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label">Unité responsable</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-building"></i>
                    <input type="text" class="form-control" formControlName="unit_responsable" placeholder="Unité">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Direction</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-briefcase"></i>
                    <select class="form-control" formControlName="direction">
                        <option [value]="null">Aucune</option>
                        <option *ngFor="let d of directions" [value]="d.id">{{ d.nom }}</option>
                    </select>
                </div>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label">Parent</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-sitemap"></i>
                    <select class="form-control" formControlName="parent">
                        <option [value]="null">Aucun</option>
                        <option *ngFor="let p of parents" [value]="p.id">{{ p.code }} - {{ p.title }}</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-title">Gestion de Conservation</div>
        <div class="row">
            <div class="col-md-4 mb-1">
                <label class="form-label">Courant - Durée (ans)</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-time"></i>
                    <input type="number" class="form-control" formControlName="conservation_active_period" placeholder="0">
                </div>
            </div>

            <div class="col-md-4 mb-1">
                <label class="form-label">Intermédiaire - Durée (ans)</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-time"></i>
                    <input type="number" class="form-control" formControlName="conservation_semi_active_period" placeholder="0">
                </div>
            </div>

            <div class="col-md-4 mb-1">
                <label class="form-label">Délai sécurité (ans)</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-shield"></i>
                    <input type="number" class="form-control" formControlName="sort_final_security_years" placeholder="0">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Sort final</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-trash"></i>
                    <input type="text" class="form-control" formControlName="sort_final_type" placeholder="ex: Destruction">
                </div>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label">Commentaire sort final</label>
                <textarea class="form-control" formControlName="sort_final_comment" rows="2" placeholder="Commentaires..."></textarea>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Remarques</label>
                <textarea class="form-control" formControlName="remarques" rows="2" placeholder="Remarques générales..."></textarea>
            </div>
        </div>

        <div class="section-title">Options</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="is_dossier" formControlName="is_dossier">
                    <label class="form-check-label" for="is_dossier">
                        Dossier
                    </label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="validation_archive" formControlName="validation_archive">
                    <label class="form-check-label" for="validation_archive">
                        Validation archive
                    </label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="is_active" formControlName="is_active">
                    <label class="form-check-label" for="is_active">
                        Actif
                    </label>
                </div>
            </div>
        </div>
    </mat-dialog-content>

    <div class="dialog-actions">
        <button class="btn btn-light-secondary" type="button" mat-dialog-close>Annuler</button>
        <button class="btn btn-primary glow shadow-sm" type="submit" [disabled]="form.invalid">
            {{ isEditMode ? 'Enregistrer' : 'Créer' }}
        </button>
    </div>
</form>
