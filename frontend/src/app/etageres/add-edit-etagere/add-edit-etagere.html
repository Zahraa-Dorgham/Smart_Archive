<div class="modal-header">
    <h5 class="modal-title">
        <i class="bx text-primary" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modifier l\'Étagère' : 'Nouveau Niveau' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-3"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="px-3 pb-2 pt-1">
        <div class="section-title">Support</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Armoire <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-archive"></i>
                    <select class="form-control" formControlName="armoire">
                        <option [value]="null" disabled selected>Assigner à une armoire...</option>
                        <option *ngFor="let a of data.armoires" [value]="a.id">{{ a.code }}</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-title">Spécifications</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Position (Niveau) <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-list-ol"></i>
                    <input type="number" class="form-control" formControlName="numero" placeholder="ex: 1">
                </div>
            </div>

            <!-- <div class="col-md-6 mb-1">
                <label class="form-label">Code-barres</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-barcode"></i>
                    <input type="text" class="form-control" formControlName="code_barres" placeholder="Scanner tag...">
                </div>
            </div> -->
        </div>
    </mat-dialog-content>

    <div class="dialog-actions">
        <button class="btn btn-light-secondary" type="button" mat-dialog-close>Annuler</button>
        <button class="btn btn-primary glow shadow-sm" type="submit">
            {{ isEditMode ? 'Enregistrer' : 'Créer' }}
        </button>
    </div>
</form>
