<div class="modal-header bg-light-primary py-1">
    <h5 class="modal-title font-weight-bold">
        <i class="bx" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modification étagère' : 'Nouveau niveau d\'étagère' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-4"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="pt-2">
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label font-weight-bold">Armoire de destination <span class="text-danger">*</span></label>
                <fieldset class="form-group position-relative has-icon-left mb-0">
                    <select class="form-control" formControlName="armoire">
                        <option [value]="null" disabled selected>Sélectionner l'armoire...</option>
                        <option *ngFor="let a of armoires" [value]="a.id">{{ a.code }}</option>
                    </select>
                    <div class="form-control-position"><i class="bx bx-cabinet"></i></div>
                </fieldset>
                <small class="text-danger" *ngIf="form.get('armoire')?.touched && form.get('armoire')?.hasError('required')">L'armoire est requise</small>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label font-weight-bold">Numéro de Niveau <span class="text-danger">*</span></label>
                <div class="position-relative has-icon-left">
                    <input type="number" class="form-control" formControlName="numero" placeholder="ex: 1">
                    <div class="form-control-position"><i class="bx bx-list-ol"></i></div>
                </div>
                <small class="text-danger" *ngIf="form.get('numero')?.touched && form.get('numero')?.hasError('required')">Requis</small>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label font-weight-bold">Code-barres Scannable</label>
                <div class="position-relative has-icon-left">
                    <input type="text" class="form-control" formControlName="code_barres" placeholder="Scanner...">
                    <div class="form-control-position"><i class="bx bx-barcode"></i></div>
                </div>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions class="px-2 pb-2 justify-content-end">
        <button class="btn btn-light-secondary mr-1" type="button" mat-dialog-close>
            <i class="bx bx-x mr-25"></i> Annuler
        </button>
        <button class="btn btn-primary glow shadow" type="submit" [disabled]="form.invalid">
            <i class="bx bx-check-circle mr-25"></i> {{ isEditMode ? 'Enregistrer' : 'Créer l\'étagère' }}
        </button>
    </mat-dialog-actions>
</form>
