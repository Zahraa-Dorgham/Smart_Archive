<div class="dashboard-page animate__animated animate__fadeIn">
  <div class="dashboard-hero">
    <div>
      <span class="eyebrow">{{ dashboardConfig.eyebrow }}</span>
      <h2>{{ dashboardConfig.title }}</h2>
      <p>
        {{ dashboardConfig.description }}
      </p>
      <div class="direction-badge" *ngIf="directionName">
        <i class="bx bx-buildings"></i>
        <span>Direction : <strong>{{ directionName }}</strong></span>
      </div>
    </div>
    <div class="hero-actions"></div>
  </div>

  <!-- <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="loading-strip" *ngIf="loading">
    <span class="spinner-border spinner-border-sm"></span>
    Chargement des statistiques...
  </div> -->

  <ng-container [ngSwitch]="dashboardRole">
    <app-admin-dashboard 
      *ngSwitchCase="'admin'"
      [globalStats]="globalStats"
      [kpiCards]="kpiCards"
      [locationCards]="locationCards"
      [transferStatus]="transferStatus"
      [pendingTransfers]="pendingTransfers"
      [phaseDistribution]="phaseDistribution"
      [recentTransfers]="recentTransfers"
      [documentEvolution]="documentEvolution"
      [batimentStats]="batimentStats"
      [recentLogins]="recentLogins"
      [phaseTotal]="phaseTotal"
      [maxPhaseTotal]="maxPhaseTotal"
      [phaseColors]="phaseColors"
      [latestDocumentEvolution]="latestDocumentEvolution"
      [documentEvolutionArea]="documentEvolutionArea"
      [documentEvolutionPolyline]="documentEvolutionPolyline"
      [documentEvolutionChartPoints]="documentEvolutionChartPoints"
      [phaseDonutBackground]="phaseDonutBackground"
      [maxBatimentDocuments]="maxBatimentDocuments"
      [loading]="loading"
    ></app-admin-dashboard>

    <app-archiviste-dashboard 
      *ngSwitchCase="'archiviste'"
      [globalStats]="globalStats"
      [kpiCards]="kpiCards"
      [locationCards]="locationCards"
      [transferStatus]="transferStatus"
      [pendingTransfers]="pendingTransfers"
      [phaseDistribution]="phaseDistribution"
      [recentTransfers]="recentTransfers"
      [documentEvolution]="documentEvolution"
      [batimentStats]="batimentStats"
      [phaseTotal]="phaseTotal"
      [maxPhaseTotal]="maxPhaseTotal"
      [phaseColors]="phaseColors"
      [latestDocumentEvolution]="latestDocumentEvolution"
      [documentEvolutionArea]="documentEvolutionArea"
      [documentEvolutionPolyline]="documentEvolutionPolyline"
      [documentEvolutionChartPoints]="documentEvolutionChartPoints"
      [phaseDonutBackground]="phaseDonutBackground"
      [maxBatimentDocuments]="maxBatimentDocuments"
      [loading]="loading"
    ></app-archiviste-dashboard>

    <app-responsable-dashboard 
      *ngSwitchCase="'responsable'"
      [globalStats]="globalStats"
      [kpiCards]="kpiCards"
      [transferStatus]="transferStatus"
      [pendingTransfers]="pendingTransfers"
      [phaseDistribution]="phaseDistribution"
      [recentTransfers]="recentTransfers"
      [documentEvolution]="documentEvolution"
      [phaseTotal]="phaseTotal"
      [maxPhaseTotal]="maxPhaseTotal"
      [phaseColors]="phaseColors"
      [latestDocumentEvolution]="latestDocumentEvolution"
      [documentEvolutionArea]="documentEvolutionArea"
      [documentEvolutionPolyline]="documentEvolutionPolyline"
      [documentEvolutionChartPoints]="documentEvolutionChartPoints"
      [phaseDonutBackground]="phaseDonutBackground"
      [loading]="loading"
    ></app-responsable-dashboard>

    <app-employe-dashboard 
      *ngSwitchCase="'employe'"
      [globalStats]="globalStats"
      [kpiCards]="kpiCards"
      [phaseDistribution]="phaseDistribution"
      [documentEvolution]="documentEvolution"
      [phaseTotal]="phaseTotal"
      [phaseColors]="phaseColors"
      [documentEvolutionPolyline]="documentEvolutionPolyline"
      [phaseDonutBackground]="phaseDonutBackground"
      [loading]="loading"
    ></app-employe-dashboard>
  </ng-container>
</div>
