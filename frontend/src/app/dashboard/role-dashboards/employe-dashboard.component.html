<!-- KPI Grid -->
<div class="kpi-grid">
  <div class="kpi-card" *ngFor="let card of kpiCards; trackBy: trackById" [ngClass]="'tone-' + card.tone">
    <div class="kpi-icon">
      <i class="bx" [ngClass]="card.icon"></i>
    </div>
    <div>
      <span>{{ card.label }}</span>
      <strong>{{ card.value | number }}</strong>
      <small>{{ card.hint }}</small>
    </div>
  </div>
</div>

<div class="content-grid">
  <!-- Distribution by Phase -->
  <section class="panel distribution-panel">
    <div class="panel-header">
      <span class="eyebrow">Stockage</span>
      <h5>Phases d'archivage</h5>
    </div>
    <div class="phase-layout">
      <div class="phase-donut" [style.background]="phaseDonutBackground"></div>
      <div class="phase-list">
        <div class="phase-row" *ngFor="let phase of phaseDistribution; trackBy: trackById">
          <div class="phase-row-head"><span>{{ phase.nom }}</span></div>
          <small>{{ phase.documents | number }} documents disponibles</small>
        </div>
      </div>
    </div>
  </section>

  <!-- Evolution -->
  <section class="panel evolution-panel">
    <div class="panel-header"><h5>Volume documentaire</h5></div>
    <div class="evolution-chart" *ngIf="documentEvolution.length > 0">
      <svg viewBox="0 0 720 220" preserveAspectRatio="none">
        <line x1="42" y1="18" x2="42" y2="186" class="chart-axis"></line>
        <line x1="42" y1="186" x2="702" y2="186" class="chart-axis"></line>
        <polygon [attr.points]="documentEvolutionArea" class="chart-area"></polygon>
        <polyline [attr.points]="documentEvolutionPolyline" class="chart-line"></polyline>
        <g *ngFor="let point of documentEvolutionChartPoints; trackBy: trackById">
          <circle [attr.cx]="point.x" [attr.cy]="point.y" r="4" class="chart-dot"></circle>
        </g>
      </svg>
      <div class="evolution-labels">
        <span *ngFor="let point of documentEvolution; let i = index">
          {{ i === 0 || i === documentEvolution.length - 1 || i === 5 ? point.label : '' }}
        </span>
      </div>
    </div>
  </section>
</div>
