<div class="app-content content">
    <div class="content-wrapper">
        <div class="content-body">
            <section id="auth-login" class="flexbox-container">
                <div class="col-xl-10 col-12">
                    <div class="card bg-authentication mb-0">
                        <div class="row m-0">
                            <div class="col-md-6 col-12 px-0 bg-white">
                                <div class="card-body p-3 h-100 d-flex flex-column justify-content-center">
                                    <div class="card-title mb-2">
                                        <h4 class="text-center font-weight-bold mb-0">Welcome Back </h4>
                                        <p class="text-center text-muted font-small-3">Connectez-vous pour accéder à votre espace ETAP.</p>
                                    </div>

                                    <div *ngIf="errorMessage" class="alert alert-danger font-small-3 mb-2" role="alert" style="display: block !important;">
                                        <div class="d-flex align-items-center">
                                            <i class="bx bx-error-circle mr-50" style="font-size: 1.2rem;"></i> 
                                            <span [innerHTML]="errorMessage"></span>
                                        </div>
                                        <div *ngIf="showResend" class="mt-1">
                                            <button type="button" class="btn btn-warning btn-sm glow" (click)="resendVerification()" [disabled]="resending">
                                                <i class="bx bx-mail-send mr-25"></i>
                                                <span *ngIf="!resending">Renvoyer le lien de vérification</span>
                                                <span *ngIf="resending" class="spinner-border spinner-border-sm"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                                        <div class="form-group mb-1">
                                            <div class="input-group">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text" [class.border-danger]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                                                        <i class="bx bx-user"></i>
                                                    </span>
                                                </div>
                                                <input type="text" formControlName="username" class="form-control"
                                                    [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
                                                    placeholder="Nom d'utilisateur">
                                            </div>
                                            <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-danger font-small-2 mt-25">
                                                <small>Le nom d'utilisateur est requis.</small>
                                            </div>
                                        </div>

                                        <div class="form-group mb-1">
                                            <div class="input-group">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text" [class.border-danger]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                                                        <i class="bx bx-lock"></i>
                                                    </span>
                                                </div>
                                                <input [type]="hidePassword ? 'password' : 'text'"
                                                    formControlName="password" class="form-control"
                                                    [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                                                    placeholder="Mot de passe">
                                                <div class="input-group-append">
                                                    <span class="input-group-text cursor-pointer"
                                                        [class.border-danger]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                                                        (click)="hidePassword = !hidePassword">
                                                        <i class="bx"
                                                            [ngClass]="!hidePassword ? 'bx-show' : 'bx-hide'"></i>
                                                    </span>
                                                </div>
                                            </div>
                                            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger font-small-2 mt-25">
                                                <small>Le mot de passe est requis.</small>
                                            </div>
                                        </div>

                                        <div class="form-group d-flex justify-content-between align-items-center mb-2">
                                            <div class="checkbox checkbox-sm">
                                                <input type="checkbox" formControlName="rememberMe" id="rememberMe">
                                                <label for="rememberMe"><small>Se souvenir de moi</small></label>
                                            </div>
                                            <a routerLink="/forgot-password" class="card-link"><small>Mot de passe oublié ?</small></a>
                                        </div>

                                        <button type="submit" class="btn btn-primary glow w-100"
                                            [disabled]="loginForm.invalid || loading">
                                            <span *ngIf="!loading">Se connecter</span>
                                            <span *ngIf="loading" class="spinner-border spinner-border-sm"
                                                role="status"></span>
                                        </button>
                                    </form>
                                    
                                    <!-- <div class="text-center mt-2">
                                        <small>Vous n'avez pas encore de compte ? </small>
                                        <a routerLink="/register"><small>Créer un compte</small></a>
                                    </div> -->
                                </div>
                            </div>

                            <div
                                class="col-md-6 d-md-flex d-none text-center align-items-center justify-content-center p-3 right-section">
                                <div class="card-content w-100">
                                    <h4 class="font-weight-bold">Nice to see you again</h4>
                                    <p class="text-muted mb-2">Saisissez vos identifiants et commencez votre session.</p>
                                    <div class="image-container mb-3">
                                        <img class="img-fluid rounded shadow-sm" src="https://radioexpressfm.com/wp-content/uploads/2024/06/ETAP.jpg" alt="oil rig">
                                    </div>
                                    <div class="mt-4">
                                        <p class="text-muted font-small-2">© 2026 ETAP. Tous droits réservés.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
>
