<div class="modal-header">
    <h5 class="modal-title">
        <i class="bx text-primary" [ngClass]="isEditMode ? 'bx-edit' : 'bx-plus-circle'"></i>
        {{ isEditMode ? 'Modifier le transfert' : 'Nouveau transfert' }}
    </h5>
    <button mat-icon-button mat-dialog-close class="btn-close-custom">
        <i class="bx bx-x font-medium-3"></i>
    </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content class="px-3 pb-2 pt-1">
        <div class="section-title">Informations</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Référence</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-hash"></i>
                    <input type="text" class="form-control" formControlName="reference" placeholder="Ex: TR-2026-001">
                </div>
            </div>
        </div>

        <div class="section-title">Classification & Statut</div>
        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Type de transfert <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-shuffle"></i>
                    <select class="form-control" formControlName="typeTransfer">
                        <option *ngFor="let option of typeOptions" [ngValue]="option">{{ option }}</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-1">
                <label class="form-label">Statut <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-flag"></i>
                    <select class="form-control" formControlName="statut">
                        <option *ngFor="let option of statusOptions" [ngValue]="option">{{ option }}</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-title">Dates</div>
        <div class="row">
            <div class="col-md-6 mb-1">
                <label class="form-label">Date demande <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-calendar"></i>
                    <input type="date" class="form-control" formControlName="date_demande">
                </div>
            </div>

            <div class="col-md-6 mb-1">
                <label class="form-label">Date execution</label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-calendar-check"></i>
                    <input type="date" class="form-control" formControlName="date_execution">
                </div>
            </div>
        </div>

        <div class="section-title">Boitiers liés</div>
        <div class="row">
            <div class="col-md-12 mb-1">
                <label class="form-label">Boitiers <span class="text-danger">*</span></label>
                <div class="icon-input-wrapper">
                    <i class="bx bx-package"></i>
                    <mat-form-field appearance="outline" class="form-field-style w-100">
                        <mat-select formControlName="boitier_ids" multiple
                            placeholder="Choisir un ou plusieurs boitiers">
                            <mat-select-trigger>
                                <div class="d-flex align-items-center">
                                    <span class="badge badge-light-primary"
                                        *ngIf="form.get('boitier_ids')?.value?.length > 0">
                                        {{ form.get('boitier_ids')?.value?.length }} boitier(s) sélectionné(s)
                                    </span>
                                    <span *ngIf="!form.get('boitier_ids')?.value?.length" class="text-muted">Choisir les
                                        boitiers...</span>
                                </div>
                            </mat-select-trigger>
                            <mat-option *ngFor="let b of boitiers" [value]="b.id.toString()">
                                <div class="d-flex align-items-center">
                                    <i class="bx bx-box mr-1 text-primary"></i>
                                    <span><strong>{{ b.idboit }}</strong> - {{ b.titre }}</span>
                                </div>
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </mat-dialog-content>

    <div class="dialog-actions">
        <button class="btn btn-light-secondary px-3" type="button" mat-dialog-close>Annuler</button>
        <button class="btn btn-primary glow px-4 shadow-sm" type="submit" [disabled]="form.invalid">
            <i class="bx mr-1" [ngClass]="isEditMode ? 'bx-save' : 'bx-check-circle'"></i>
            {{ isEditMode ? 'Enregistrer' : 'Créer' }}
        </button>
    </div>
</form>
